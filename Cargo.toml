[workspace]
resolver = "2"
members = ["crates/sony-core"]  # app/src-tauri added by the app once it exists

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/owaiskaifi/sony-connect"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
